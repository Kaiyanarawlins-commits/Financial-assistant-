<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CashCompass — see where your money is pointed." />

    <!--
      Two theme-color entries so the phone's status bar matches the app rather
      than flashing the opposite ground behind it.
    -->
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />

    <!-- Installed to the home screen: run without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CashCompass" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Inline SVG favicon: no extra request, and it scales in the tab strip. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235b8bff' stroke-width='2'/%3E%3Cpath d='M21.5 10.5l-3.2 7.8-7.8 3.2 3.2-7.8z' fill='%235b8bff'/%3E%3C/svg%3E"
    />

    <title>CashCompass</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
